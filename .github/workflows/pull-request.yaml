name: Pull Request

on:
  pull_request: {}

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: >-
          nix build -L --keep-going
          .#checks.x86_64-linux.nix-lint
          .#checks.x86_64-linux.actionlint
          .#checks.x86_64-linux.ci-coverage
          .#checks.x86_64-linux.vet
          .#checks.x86_64-linux.golangci-lint
      - run: nix develop -c go mod tidy -diff

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build -L .#checks.x86_64-linux.formatting

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build -L .#checks.x86_64-linux.typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: >-
          nix build -L --keep-going
          .#checks.x86_64-linux.test
          .#checks.x86_64-linux.roundtrip

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build -L .#checks.x86_64-linux.package
