name: Pull Request

on:
  pull_request: {}

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build -L .#checks.x86_64-linux.formatting

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build -L .#checks.x86_64-linux.vet .#checks.x86_64-linux.actionlint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build -L .#checks.x86_64-linux.package .#checks.x86_64-linux.roundtrip
